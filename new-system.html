<script>
(function () {
  const donorButtonOld = document.querySelectorAll(".main-button")[0];
  if (!donorButtonOld) return;

  const donorButton = donorButtonOld.cloneNode(true);
  donorButtonOld.replaceWith(donorButton);

  donorButton.addEventListener("click", function () {
    const main = document.querySelector(".main-container");
    const grid = document.querySelector(".button-grid");
    const oldPage = document.getElementById("section-page");
    if (oldPage) oldPage.remove();

    grid.style.display = "none";

    const page = document.createElement("section");
    page.id = "section-page";
    page.style.cssText =
      "background:#fff9e9;color:#073d2c;padding:16px;margin:15px 0;border-radius:15px;text-align:left;";

    page.innerHTML = `
      <style>
        #section-page label {
          display:block;
          font-weight:bold;
          margin-top:12px;
        }
        #section-page input,
        #section-page textarea,
        #section-page select {
          width:100%;
          padding:12px;
          margin-top:5px;
          border:1px solid #b9a36c;
          border-radius:8px;
          font-size:16px;
          box-sizing:border-box;
        }
        #section-page button {
          padding:11px 14px;
          margin:5px 3px;
          border:0;
          border-radius:8px;
          font-weight:bold;
          cursor:pointer;
        }
        #section-page .save-btn {
          background:#075b3c;color:white;
        }
        #section-page .other-btn {
          background:#d8b45b;color:#073d2c;
        }
        #section-page .danger-btn {
          background:#a83232;color:white;
        }
        #section-page .donor-card {
          background:white;
          border:1px solid #d8b45b;
          border-radius:10px;
          padding:12px;
          margin-top:12px;
          overflow-wrap:anywhere;
        }
        #section-page a {
          color:#075b3c;
          display:inline-block;
          margin:5px;
        }
      </style>

      <h2 style="text-align:center">දායක තොරතුරු</h2>

      <p id="donorCount">දායකයන් ගණන: 0</p>

      <label>ඉඩම් අංකය *</label>
      <input id="donorLand" type="text" placeholder="ඉඩම් අංකය">

      <label>දායකයාගේ සම්පූර්ණ නම *</label>
      <input id="donorName" type="text" placeholder="නම">

      <label>ලිපිනය</label>
      <textarea id="donorAddress" rows="2" placeholder="ලිපිනය"></textarea>

      <label>ප්‍රදේශය</label>
      <input id="donorArea" type="text" placeholder="ප්‍රදේශය ඇතුළත් කරන්න">

      <label>පටුමඟ</label>
      <select id="donorLane">
        <option value="">පටුමඟ තෝරන්න</option>
        <option value="පළමු පටුමඟ">පළමු පටුමඟ</option>
        <option value="දෙවැනි පටුමඟ">දෙවැනි පටුමඟ</option>
        <option value="තුන්වැනි පටුමඟ">තුන්වැනි පටුමඟ</option>
        <option value="හතරවැනි පටුමඟ">හතරවැනි පටුමඟ</option>
        <option value="පස්වැනි පටුමඟ">පස්වැනි පටුමඟ</option>
      </select>

      <label>පළමු දුරකථන අංකය</label>
      <input id="donorPhone1" type="tel" placeholder="දුරකථන අංකය">

      <label>දෙවැනි දුරකථන අංකය</label>
      <input id="donorPhone2" type="tel" placeholder="දුරකථන අංකය">

      <label>තුන්වැනි දුරකථන අංකය</label>
      <input id="donorPhone3" type="tel" placeholder="දුරකථන අංකය">

      <label>විශේෂ සටහන්</label>
      <textarea id="donorNote" rows="3" placeholder="සටහන්"></textarea>

      <div style="margin-top:15px">
        <button class="save-btn" id="saveDonor">සේව් කරන්න</button>
        <button class="other-btn" id="clearDonor">හිස් කරන්න</button>
      </div>

      <hr>

      <h3>ඉඩම් අංකයෙන් දායකයා සොයන්න</h3>
      <input id="searchLand" placeholder="ඉඩම් අංකය ඇතුළත් කරන්න">
      <button class="other-btn" id="searchDonor">සොයන්න</button>

      <div id="donorResult"></div>

      <hr>
      <h3>දායක ලැයිස්තුව</h3>
      <div id="donorList"></div>

      <button class="other-btn" id="backDonor"
        style="background:#073d2c;color:white;width:100%;margin-top:18px">
        මුල් පිටුවට
      </button>
    `;

    main.appendChild(page);

    let editLand = "";

    function getDonors() {
      try {
        const data = JSON.parse(
          localStorage.getItem("sugathaDonors") || "[]"
        );
        return Array.isArray(data) ? data : [];
      } catch (error) {
        alert("දායක දත්ත කියවීමේ දෝෂයක් ඇත.");
        return [];
      }
    }

    function normalize(value) {
      return String(value || "").trim().toLowerCase();
    }

    function field(id) {
      return document.getElementById(id);
    }

    function clearFields() {
      [
        "donorLand", "donorName", "donorAddress",
        "donorArea", "donorPhone1", "donorPhone2",
        "donorPhone3", "donorNote"
      ].forEach(id => field(id).value = "");

      field("donorLane").value = "";
      editLand = "";
      field("saveDonor").textContent = "සේව් කරන්න";
    }

    function updateCount() {
      field("donorCount").textContent =
        "දායකයන් ගණන: " + getDonors().length;
    }

    function renderList() {
      const list = field("donorList");
      list.replaceChildren();

      getDonors().forEach(donor => {
        const item = document.createElement("div");
        item.className = "donor-card";

        const info = document.createElement("p");
        info.textContent =
          "ඉඩම් අංකය: " + donor.land + " | නම: " + donor.name;

        const view = document.createElement("button");
        view.className = "other-btn";
        view.textContent = "විස්තර බලන්න";
        view.onclick = function () {
          field("searchLand").value = donor.land;
          showDonor(donor.land);
        };

        item.append(info, view);
        list.appendChild(item);
      });

      updateCount();
    }

    function saveDonor() {
      const land = field("donorLand").value.trim();
      const name = field("donorName").value.trim();

      if (!land || !name) {
        alert("ඉඩම් අංකය සහ නම අනිවාර්යයෙන් ඇතුළත් කරන්න.");
        return;
      }

      let donors = getDonors();

      const duplicate = donors.some(d =>
        normalize(d.land) === normalize(land) &&
        normalize(d.land) !== normalize(editLand)
      );

      if (duplicate) {
        alert("මෙම ඉඩම් අංකය දැනටමත් ඇතුළත් කර ඇත.");
        return;
      }

      const donor = {
        land: land,
        name: name,
        address: field("donorAddress").value.trim(),
        area: field("donorArea").value.trim(),
        lane: field("donorLane").value,
        phones: [
          field("donorPhone1").value.trim(),
          field("donorPhone2").value.trim(),
          field("donorPhone3").value.trim()
        ],
        note: field("donorNote").value.trim()
      };

      if (editLand) {
        donors = donors.map(d =>
          normalize(d.land) === normalize(editLand) ? donor : d
        );
      } else {
        donors.push(donor);
      }

      try {
        localStorage.setItem("sugathaDonors", JSON.stringify(donors));
        alert(editLand ? "දායක තොරතුරු යාවත්කාලීන කළා." :
          "දායක තොරතුරු සුරැකුණා.");
        clearFields();
        renderList();
      } catch (error) {
        alert("දත්ත සුරැකීමට නොහැකි වුණා. දුරකථනයේ ගබඩා ඉඩ පරීක්ෂා කරන්න.");
      }
    }

    function showDonor(land) {
      const donor = getDonors().find(d =>
        normalize(d.land) === normalize(land)
      );

      const result = field("donorResult");
      result.replaceChildren();

      if (!donor) {
        result.textContent = "දායක තොරතුරු හමු නොවීය.";
        return;
      }

      const card = document.createElement("div");
      card.className = "donor-card";

      function addLine(label, value) {
        const p = document.createElement("p");
        p.textContent = label + ": " + (value || "-");
        card.appendChild(p);
      }

      addLine("ඉඩම් අංකය", donor.land);
      addLine("නම", donor.name);
      addLine("ලිපිනය", donor.address);
      addLine("ප්‍රදේශය", donor.area);
      addLine("පටුමඟ", donor.lane);
      addLine("විශේෂ සටහන්", donor.note);

      (donor.phones || []).filter(Boolean).forEach(phone => {
        const row = document.createElement("p");
        const call = document.createElement("a");
        call.href = "tel:" + phone;
        call.textContent = "ඇමතුම: " + phone;
        row.appendChild(call);

        const digits = phone.replace(/\D/g, "");
        let whatsappNumber = digits;
        if (whatsappNumber.startsWith("0")) {
          whatsappNumber = "94" + whatsappNumber.substring(1);
        }

        if (whatsappNumber) {
          const wa = document.createElement("a");
          wa.href = "https://wa.me/" + whatsappNumber;
          wa.target = "_blank";
          wa.rel = "noopener";
          wa.textContent = "WhatsApp";
          row.appendChild(wa);
        }
        card.appendChild(row);
      });

      const edit = document.createElement("button");
      edit.className = "other-btn";
      edit.textContent = "එඩිට් කරන්න";
      edit.onclick = function () {
        field("donorLand").value = donor.land || "";
        field("donorName").value = donor.name || "";
        field("donorAddress").value = donor.address || "";
        field("donorArea").value = donor.area || "";
        field("donorLane").value = donor.lane || "";
        field("donorNote").value = donor.note || "";

        const phones = donor.phones || [];
        field("donorPhone1").value = phones[0] || "";
        field("donorPhone2").value = phones[1] || "";
        field("donorPhone3").value = phones[2] || "";

        editLand = donor.land;
        field("saveDonor").textContent = "යාවත්කාලීන කරන්න";
        window.scrollTo(0, 0);
      };

      const remove = document.createElement("button");
      remove.className = "danger-btn";
      remove.textContent = "මකා දමන්න";
      remove.onclick = function () {
        if (!confirm("මෙම දායක තොරතුරු මකා දමන්නද?")) return;

        const remaining = getDonors().filter(d =>
          normalize(d.land) !== normalize(donor.land)
        );

        localStorage.setItem("sugathaDonors", JSON.stringify(remaining));
        result.textContent = "දායක තොරතුරු මකා දැමුවා.";
        clearFields();
        renderList();
      };

      card.append(edit, remove);
      result.appendChild(card);
    }

    field("saveDonor").onclick = saveDonor;
    field("clearDonor").onclick = clearFields;

    field("searchDonor").onclick = function () {
      const land = field("searchLand").value.trim();
      if (!land) {
        alert("සෙවීමට ඉඩම් අංකය ඇතුළත් කරන්න.");
        return;
      }
      showDonor(land);
    };

    field("searchLand").addEventListener("keydown", function (event) {
      if (event.key === "Enter") field("searchDonor").click();
    });

    field("backDonor").onclick = function () {
      page.remove();
      grid.style.display = "grid";
    };

    renderList();
  });
})();
</script>
