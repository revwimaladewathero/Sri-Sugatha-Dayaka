
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ශ්‍රී සුගත දායක තොරතුරු පද්ධතිය</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #073d2c;
  color: #ffffff;
}
header {
  text-align: center;
  padding: 25px 10px;
  background: linear-gradient(135deg,#063323,#16704b);
  border-bottom: 4px solid #d8b45b;
}
header h1 {
  font-size: 24px;
  margin: 5px;
}
header p {
  margin: 5px;
  color: #f5df9c;
}
</style>
</head>
<body>

<header>
<h1>ශ්‍රී සුගත දායක තොරතුරු පද්ධතිය</h1>
<p>ශ්‍රී සුගත විවේක සේනාසනය</p>
<p>කු.ග 05, දකුණු ඉවුර, මුවන් වැව, ලුණුගම්වෙහෙර</p>
</header>
</body>
</html>
<style>
.main-container {
  max-width: 900px;
  margin: 25px auto;
  padding: 12px;
}
.button-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.main-button {
  min-height: 90px;
  padding: 12px;
  border: 2px solid #d8b45b;
  border-radius: 15px;
  background: linear-gradient(145deg,#fff4ce,#d8b45b);
  color: #073d2c;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.main-button:active {
  transform: scale(0.97);
}
@media(max-width:400px) {
  .main-button {
    font-size: 13px;
  }
}
</style>

<main class="main-container">
<div class="button-grid">

<button class="main-button">01. දායක තොරතුරු</button>
<button class="main-button">02. දාන ලේඛනය</button>
<button class="main-button">03. පොහොය දින දාන ලේඛනය</button>
<button class="main-button">04. මුදල් හා භාණ්ඩ පරිත්‍යාග</button>
<button class="main-button">05. ඡායාරූප හා වීඩියෝ</button>
<button class="main-button">06. පෞද්ගලික ගොනුව</button>
<button class="main-button">07. භාණ්ඩ ලේඛනය</button>
<button class="main-button">08. වියදම් ලේඛනය</button>
<button class="main-button">09. විහාරස්ථාන සංවර්ධන කටයුතු</button>
<button class="main-button">10. විහාරස්ථාන දින දර්ශනය</button>
<button class="main-button">11. නිවේදන හා දැනුම්දීම්</button>
<button class="main-button">12. ලේඛන හා වාර්තා ගබඩාව</button>
<button class="main-button">13. වාර්තා හා සාරාංශ</button>
<button class="main-button">14. සාමණේර අවශ්‍යතා</button>
<button class="main-button">15. භාණ්ඩ පරීක්ෂණ</button>
<button class="main-button">16. බුද්ධ පූජා භාණ්ඩ</button>
<button class="main-button">17. පින්කම් භාණ්ඩ නිකුත් කිරීම හා භාරගැනීම</button>

</div>
</main>
<script>
const sectionNames = [
"දායක තොරතුරු",
"දාන ලේඛනය",
"පොහොය දින දාන ලේඛනය",
"මුදල් හා භාණ්ඩ පරිත්‍යාග",
"ඡායාරූප හා වීඩියෝ",
"පෞද්ගලික ගොනුව",
"භාණ්ඩ ලේඛනය",
"වියදම් ලේඛනය",
"විහාරස්ථාන සංවර්ධන කටයුතු",
"විහාරස්ථාන දින දර්ශනය",
"නිවේදන හා දැනුම්දීම්",
"ලේඛන හා වාර්තා ගබඩාව",
"වාර්තා හා සාරාංශ",
"සාමණේර අවශ්‍යතා",
"භාණ්ඩ පරීක්ෂණ",
"බුද්ධ පූජා භාණ්ඩ",
"පින්කම් භාණ්ඩ නිකුත් කිරීම හා භාරගැනීම"
];

const buttons = document.querySelectorAll(".main-button");

buttons.forEach((button, index) => {
  button.addEventListener("click", function() {
    const oldPage = document.getElementById("section-page");
    if (oldPage) oldPage.remove();

    document.querySelector(".main-container").style.display = "none";

    const page = document.createElement("section");
    page.id = "section-page";
    page.style.cssText =
      "background:#fff9e9;color:#073d2c;padding:20px;margin:20px 12px;border-radius:15px;text-align:center;";

    const title = document.createElement("h2");
    title.textContent = sectionNames[index];

    const message = document.createElement("p");
    message.textContent =
      "මෙම කොටස සඳහා අවශ්‍ය පහසුකම් සකස් කරමින් පවතී.";

    const back = document.createElement("button");
    back.textContent = "මුල් පිටුවට";
    back.style.cssText =
      "padding:12px 22px;background:#073d2c;color:white;border:0;border-radius:9px;font-size:16px;";
    back.onclick = function() {
      page.remove();
      document.querySelector(".main-container").style.display = "block";
    };

    page.appendChild(title);
    page.appendChild(message);
    page.appendChild(back);
    document.querySelector("main").appendChild(page);
  });
});
</script>
<script>
document.querySelectorAll(".main-button").forEach((oldButton) => {
  const button = oldButton.cloneNode(true);
  oldButton.replaceWith(button);

  button.addEventListener("click", function() {
    const main = document.querySelector(".main-container");
    const grid = document.querySelector(".button-grid");

    const oldPage = document.getElementById("section-page");
    if (oldPage) oldPage.remove();

    grid.style.display = "none";

    const page = document.createElement("section");
    page.id = "section-page";
    page.style.cssText =
      "background:#fff9e9;color:#073d2c;padding:20px;margin:20px 0;border-radius:15px;text-align:center;";

    const title = document.createElement("h2");
    title.textContent = button.textContent;

    const message = document.createElement("p");
    message.textContent =
      "මෙම කොටස සඳහා අවශ්‍ය පහසුකම් සකස් කරමින් පවතී.";

    const back = document.createElement("button");
    back.textContent = "මුල් පිටුවට";
    back.style.cssText =
      "padding:12px 22px;background:#073d2c;color:white;border:0;border-radius:9px;font-size:16px;";

    back.onclick = function() {
      page.remove();
      grid.style.display = "grid";
    };

    page.appendChild(title);
    page.appendChild(message);
    page.appendChild(back);
    main.appendChild(page);
  });
});
</script>
<script>
const donorButtonOld = document.querySelectorAll(".main-button")[0];
const donorButton = donorButtonOld.cloneNode(true);
donorButtonOld.replaceWith(donorButton);

donorButton.addEventListener("click", function() {
  const main = document.querySelector(".main-container");
  const grid = document.querySelector(".button-grid");
  grid.style.display = "none";

  const oldPage = document.getElementById("section-page");
  if (oldPage) oldPage.remove();

  const page = document.createElement("section");
  page.id = "section-page";
  page.style.cssText =
    "background:#fff9e9;color:#073d2c;padding:16px;margin:15px 0;border-radius:15px;";

  page.innerHTML = `
    <h2>දායක තොරතුරු</h2>
    <label>ඉඩම් අංකය</label>
    <input id="landNo" style="width:100%;padding:12px;margin:6px 0 12px">
    <label>නම</label>
    <input id="donorName" style="width:100%;padding:12px;margin:6px 0 12px">
    <label>ලිපිනය</label>
    <textarea id="donorAddress" style="width:100%;padding:12px;margin:6px 0 12px"></textarea>
    <label>ප්‍රදේශය</label>
    <input id="donorArea" style="width:100%;padding:12px;margin:6px 0 12px">
    <label>දුරකථන අංකය 1</label>
    <input id="phone1" type="tel" style="width:100%;padding:12px;margin:6px 0 12px">
    <label>දුරකථන අංකය 2</label>
    <input id="phone2" type="tel" style="width:100%;padding:12px;margin:6px 0 12px">
    <label>දුරකථන අංකය 3</label>
    <input id="phone3" type="tel" style="width:100%;padding:12px;margin:6px 0 12px">
    <button id="saveDonor" style="padding:12px;background:#075b3c;color:white;border:0;border-radius:8px">සුරකින්න</button>
    <hr>
    <h3>ඉඩම් අංකයෙන් සොයන්න</h3>
    <input id="searchLand" placeholder="ඉඩම් අංකය ඇතුළත් කරන්න" style="width:100%;padding:12px;margin:6px 0">
    <button id="searchDonor" style="padding:10px">සොයන්න</button>
    <div id="donorResult"></div>
    <button id="backDonor" style="padding:12px;margin-top:18px;background:#073d2c;color:white;border:0;border-radius:8px">මුල් පිටුවට</button>
  `;

  main.appendChild(page);

  let editLand = "";

  function getDonors() {
    return JSON.parse(localStorage.getItem("sugathaDonors") || "[]");
  }

  function clearFields() {
    ["landNo","donorName","donorAddress","donorArea","phone1","phone2","phone3"]
      .forEach(id => document.getElementById(id).value = "");
    editLand = "";
  }

  document.getElementById("saveDonor").onclick = function() {
    const land = document.getElementById("landNo").value.trim();
    const name = document.getElementById("donorName").value.trim();

    if (!land || !name) {
      alert("ඉඩම් අංකය සහ නම ඇතුළත් කරන්න.");
      return;
    }

    let donors = getDonors();
    const donor = {
      land,
      name,
      address: document.getElementById("donorAddress").value,
      area: document.getElementById("donorArea").value,
      phones: [
        document.getElementById("phone1").value,
        document.getElementById("phone2").value,
        document.getElementById("phone3").value
      ]
    };

    if (editLand) {
      donors = donors.map(d => d.land === editLand ? donor : d);
    } else {
      if (donors.some(d => d.land === land)) {
        alert("මෙම ඉඩම් අංකය දැනටමත් ඇතුළත් කර ඇත.");
        return;
      }
      donors.push(donor);
    }

    localStorage.setItem("sugathaDonors", JSON.stringify(donors));
    alert("දායක තොරතුරු සුරැකුණා.");
    clearFields();
  };

  document.getElementById("searchDonor").onclick = function() {
    const land = document.getElementById("searchLand").value.trim();
    const donor = getDonors().find(d => d.land === land);
    const result = document.getElementById("donorResult");

    if (!donor) {
      result.textContent = "තොරතුරු හමු නොවීය.";
      return;
    }

    result.innerHTML = `
      <p><b>ඉඩම් අංකය:</b> ${donor.land}</p>
      <p><b>නම:</b> ${donor.name}</p>
      <p><b>ලිපිනය:</b> ${donor.address}</p>
      <p><b>ප්‍රදේශය:</b> ${donor.area}</p>
      <p><b>දුරකථන:</b> ${donor.phones.join(" / ")}</p>
      <button id="editDonor">සංස්කරණය</button>
      <button id="deleteDonor">මකා දමන්න</button>
    `;

    document.getElementById("editDonor").onclick = function() {
      document.getElementById("landNo").value = donor.land;
      document.getElementById("donorName").value = donor.name;
      document.getElementById("donorAddress").value = donor.address;
      document.getElementById("donorArea").value = donor.area;
      ["phone1","phone2","phone3"].forEach((id,i) => {
        document.getElementById(id).value = donor.phones[i] || "";
      });
      editLand = donor.land;
      window.scrollTo(0,0);
    };

    document.getElementById("deleteDonor").onclick = function() {
      if (confirm("මෙම දායක තොරතුරු මකා දමන්නද?")) {
        localStorage.setItem("sugathaDonors",
          JSON.stringify(getDonors().filter(d => d.land !== donor.land)));
        result.textContent = "තොරතුරු මකා දැමුවා.";
      }
    };
  };

  document.getElementById("backDonor").onclick = function() {
    page.remove();
    grid.style.display = "grid";
  };
});
</script>
<script>
const danaOldButton = document.querySelectorAll(".main-button")[1];
const danaButton = danaOldButton.cloneNode(true);
danaOldButton.replaceWith(danaButton);

danaButton.addEventListener("click", function() {

  grid.style.display = "none";

  const page = document.createElement("section");
  page.id = "section-page";
  page.style.cssText =
    "background:#fff9e9;color:#073d2c;padding:16px;margin:15px 0;border-radius:15px;";

  page.innerHTML = `

      <option value="උදෑසන">උදෑසන දානය</option>
      <option value="දහවල්">දහවල් දානය</option>
    </select>

    <label>දායකයාගේ ඉඩම් අංකය</label>
    <input id="danaLand" placeholder="ඉඩම් අංකය"
      style="width:100%;padding:12px;margin:8px 0">

    <button id="findDanaDonor"
      style="padding:10px;margin-bottom:12px">දායකයා සොයන්න</button>

    <p id="danaDonorName">දායකයාගේ නම: තවම තෝරා නැත</p>
    <div id="danaPhones"></div>

    <label>සටහන</label>
    <textarea id="danaNote"
      style="width:100%;padding:12px;margin:8px 0 15px"></textarea>

    <button id="saveDana"
      style="padding:12px;background:#075b3c;color:white;border:0;border-radius:8px">
      දාන තොරතුරු සුරකින්න
    </button>

    <hr>
    <h3>ඉඩම් අංකයෙන් දාන ලේඛනය සොයන්න</h3>
    <input id="searchDanaLand" placeholder="ඉඩම් අංකය"
      style="width:100%;padding:12px;margin:8px 0">
    <button id="searchDana"
      style="padding:10px">සොයන්න</button>
    <div id="danaResults"></div>

    <button id="backDana"
      style="padding:12px;margin-top:18px;background:#073d2c;color:white;border:0;border-radius:8px">
      මුල් පිටුවට
    </button>
  `;

  main.appendChild(page);

  let selectedDonor = null;

  function getDonors() {
    return JSON.parse(localStorage.getItem("sugathaDonors") || "[]");
  }

  function getDanaRecords() {
    return JSON.parse(localStorage.getItem("sugathaDana") || "[]");
  }

  document.getElementById("findDanaDonor").onclick = function() {
    const land = document.getElementById("danaLand").value.trim();
    selectedDonor = getDonors().find(d => d.land === land);

    const name = document.getElementById("danaDonorName");
    const phones = document.getElementById("danaPhones");
    phones.replaceChildren();

    if (!selectedDonor) {
      name.textContent = "දායක තොරතුරු හමු නොවීය.";
      return;
    }

    name.textContent = "දායකයාගේ නම: " + selectedDonor.name;

    (selectedDonor.phones || []).filter(Boolean).forEach(phone => {
      const link = document.createElement("a");
      link.href = "tel:" + phone;
      link.textContent = "දුරකථන ඇමතුම: " + phone;
      link.style.display = "block";
      phones.appendChild(link);
    });
  };

  document.getElementById("saveDana").onclick = function() {
    const date = document.getElementById("danaDate").value;
    const land = document.getElementById("danaLand").value.trim();
    const time = document.getElementById("danaTime").value;

    if (!date || !land) {
      alert("දිනය සහ ඉඩම් අංකය ඇතුළත් කරන්න.");
      return;
    }

    const donor = getDonors().find(d => d.land === land);
    if (!donor) {
      alert("පළමුව දායක තොරතුරු කොටසට දායකයා ඇතුළත් කරන්න.");
      return;
    }

    const records = getDanaRecords();
    records.push({
      date,
      time,
      land,
      name: donor.name,
      note: document.getElementById("danaNote").value
    });

    localStorage.setItem("sugathaDana", JSON.stringify(records));

    alert("දාන තොරතුරු සුරැකුණා.");
    document.getElementById("danaDate").value = "";
    document.getElementById("danaLand").value = "";
    document.getElementById("danaNote").value = "";
    document.getElementById("danaDonorName").textContent =
      "දායකයාගේ නම: තවම තෝරා නැත";
    document.getElementById("danaPhones").replaceChildren();
    selectedDonor = null;
  };

  document.getElementById("searchDana").onclick = function() {
    const land = document.getElementById("searchDanaLand").value.trim();
    const records = getDanaRecords().filter(r => r.land === land);
    const results = document.getElementById("danaResults");
    results.replaceChildren();

    if (!records.length) {
      results.textContent = "දාන තොරතුරු හමු නොවීය.";
      return;
    }

    records.forEach(record => {
      const item = document.createElement("p");
      item.textContent =
        record.date + " | " + record.time + " | " +
        record.name + " | " + record.note;
      results.appendChild(item);
    });
  };

  document.getElementById("backDana").onclick = function() {
    page.remove();
    grid.style.display = "grid";
  };
});
</script>
